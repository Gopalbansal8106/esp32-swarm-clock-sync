<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ESP32 Swarm Telemetry Terminal</title>
    
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
    <script src="https://cdn.plot.ly/plotly-latest.min.js"></script>
    
    <style>
        :root {
            --bg-main: #f0f2f5;
            --bg-card: #ffffff;
            --border: #e2e8f0;
            --primary: #2563eb;
            --accent: #6366f1;
            --success: #10b981;
            --warning: #f59e0b;
            --danger: #ef4444;
            --text-main: #0f172a;
            --text-muted: #64748b;
            --shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            height: 100vh;
            overflow: hidden;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            background-color: var(--bg-card);
            border-bottom: 1px solid var(--border);
            padding: 12px 24px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 1px 2px rgba(0,0,0,0.05);
            z-index: 10;
        }

        .nav-title h1 { font-size: 18px; font-weight: 700; color: var(--text-main); letter-spacing: -0.5px; }
        .nav-title p { font-size: 12px; color: var(--text-muted); font-family: 'JetBrains Mono', monospace; }

        .nav-controls { display: flex; gap: 12px; align-items: center; }
        .badge { padding: 6px 12px; border-radius: 6px; font-size: 11px; font-weight: 700; text-transform: uppercase; border: 1px solid var(--border); }
        .badge.mode { color: var(--primary); background: #eff6ff; border-color: #bfdbfe; }
        .badge.live { color: var(--success); background: #ecfdf5; border-color: #a7f3d0; display: flex; align-items: center; gap: 6px; }
        .live-dot { width: 8px; height: 8px; background: var(--success); border-radius: 50%; box-shadow: 0 0 6px var(--success); }

        .dashboard-container {
            flex: 1;
            display: grid;
            grid-template-columns: 300px 1fr 340px;
            gap: 16px;
            padding: 16px;
            overflow: hidden;
        }

        .panel {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            display: flex;
            flex-direction: column;
            overflow: hidden;
            box-shadow: var(--shadow);
        }

        .panel-header {
            padding: 12px 16px;
            border-bottom: 1px solid var(--border);
            font-size: 12px;
            font-weight: 700;
            color: var(--text-main);
            background: #f8fafc;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        /* LEFT SIDEBAR */
        .sidebar-left { display: flex; flex-direction: column; gap: 16px; min-height: 0; }
        .topology-panel { height: 260px; }
        .topology-body { flex: 1; position: relative; }
        #topology-canvas { width: 100%; height: 100%; display: block; }

        .terminal-panel { flex: 1; min-height: 0; }
        .terminal-body {
            flex: 1;
            background: #0f172a;
            color: #10b981;
            font-family: 'JetBrains Mono', monospace;
            font-size: 10px;
            padding: 12px;
            overflow-y: auto;
            line-height: 1.4;
        }
        .term-line { border-bottom: 1px solid rgba(255,255,255,0.05); padding: 2px 0; }
        .term-ts { color: #64748b; margin-right: 8px; }

        /* MAIN CONTENT */
        .main-content { display: flex; flex-direction: column; gap: 16px; min-height: 0; }

        .metrics-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; }
        .metric-card {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 16px;
            display: flex;
            flex-direction: column;
            gap: 4px;
            box-shadow: var(--shadow);
            position: relative;
            overflow: hidden;
        }
        .metric-card::after { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; background: var(--primary); }
        .metric-card.success::after { background: var(--success); }
        .metric-card.warning::after { background: var(--warning); }
        
        .metric-label { font-size: 10px; font-weight: 700; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.5px; }
        .metric-value { font-size: 22px; font-weight: 800; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }

        .chart-panel { flex: 1; min-height: 0; }
        .chart-wrapper { width: 100%; height: 100%; }

        .hist-panel { height: 220px; }

        /* RIGHT SIDEBAR */
        .sidebar-right { display: flex; flex-direction: column; min-height: 0; }
        .node-list-panel { flex: 1; min-height: 0; }
        .node-list-body { padding: 12px; overflow-y: auto; flex: 1; display: flex; flex-direction: column; gap: 12px; }

        .node-card {
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 8px;
            padding: 12px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .node-header { display: flex; justify-content: space-between; align-items: center; }
        .node-name { font-size: 13px; font-weight: 700; color: var(--text-main); display: flex; align-items: center; gap: 8px; }
        
        /* Status LED */
        .led { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
        .led.green { background-color: var(--success); box-shadow: 0 0 6px var(--success); }
        .led.red { background-color: var(--danger); box-shadow: 0 0 6px var(--danger); }
        .led.gray { background-color: var(--text-muted); }

        .node-status { font-size: 10px; padding: 3px 6px; border-radius: 4px; font-weight: 700; text-transform: uppercase; }
        .node-status.leader { background: var(--success); color: white; }
        .node-status.synced { background: var(--primary); color: white; }
        .node-status.drifting { background: var(--danger); color: white; }
        
        /* Layout for details and gauge */
        .node-content { display: flex; gap: 10px; align-items: center; }
        .node-details { flex: 1; display: grid; grid-template-columns: 1fr; gap: 4px; font-family: 'JetBrains Mono', monospace; font-size: 11px; color: var(--text-muted); }
        .node-details span.val { color: var(--text-main); font-weight: 700; }

        /* CSS Gauge */
        .gauge-container {
            width: 46px;
            height: 46px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            background: conic-gradient(var(--accent) var(--gauge-deg), #e2e8f0 0deg);
        }
        .gauge-inner {
            width: 38px;
            height: 38px;
            border-radius: 50%;
            background: #fff;
            display: flex;
            align-items: center;
            justify-content: center;
            flex-direction: column;
        }
        .gauge-val { font-size: 10px; font-weight: 800; color: var(--text-main); font-family: 'JetBrains Mono', monospace; }
        .gauge-lbl { font-size: 7px; color: var(--text-muted); font-weight: 700; }

    </style>
</head>
<body>
    <div class="navbar">
        <div class="nav-title">
            <h1>Swarm Telemetry Console</h1>
            <p>> BRIDGE: NODE_0 | PORT: ACTIVE</p>
        </div>
        <div class="nav-controls">
            <div class="badge mode" id="sync-mode-badge">MODE: NULL</div>
            <div class="badge live"><div class="live-dot"></div> DATA STREAM</div>
        </div>
    </div>

    <div class="dashboard-container">
        
        <!-- LEFT: Topology & Terminal -->
        <div class="sidebar-left">
            <div class="panel topology-panel">
                <div class="panel-header">RF Topology Network</div>
                <div class="topology-body">
                    <canvas id="topology-canvas"></canvas>
                </div>
            </div>
            <div class="panel terminal-panel">
                <div class="panel-header">
                    <span>Live Telemetry Socket</span>
                    <span style="font-size: 9px; color: var(--text-muted);">RAW JSON</span>
                </div>
                <div class="terminal-body" id="raw-terminal"></div>
            </div>
        </div>

        <!-- CENTER: Metrics, Oscilloscope, Histogram -->
        <div class="main-content">
            <div class="metrics-grid">
                <div class="metric-card">
                    <span class="metric-label">UAV Nodes Active</span>
                    <span class="metric-value" id="metric-nodes">0</span>
                </div>
                <div class="metric-card success">
                    <span class="metric-label">Swarm Leader</span>
                    <span class="metric-value" id="metric-leader">N/A</span>
                </div>
                <div class="metric-card warning">
                    <span class="metric-label">Global Error (Avg)</span>
                    <span class="metric-value" id="metric-error">0.00 ms</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Flight Uptime</span>
                    <span class="metric-value" id="metric-uptime">0.0s</span>
                </div>
            </div>

            <div class="panel chart-panel">
                <div class="panel-header">Clock Offset Oscilloscope</div>
                <div class="chart-wrapper" id="offset-chart"></div>
            </div>

            <div class="panel hist-panel">
                <div class="panel-header">Error Distribution (Histogram)</div>
                <div class="chart-wrapper" id="hist-chart"></div>
            </div>
        </div>

        <!-- RIGHT: UAV Matrix -->
        <div class="sidebar-right">
            <div class="panel node-list-panel">
                <div class="panel-header">UAV Fleet Matrix</div>
                <div class="node-list-body" id="nodes-container"></div>
            </div>
        </div>

    </div>

    <script>
        let state = { nodes: [], sync_mode: 'basic', avg_sync_error: 0.0, sync_history: [], global_time: 0.0 };
        const colors = { ref: '#10b981', slave: '#2563eb' };
        const termMaxLines = 30;

        let ws = null;
        function connect() {
            const proto = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${proto}//${window.location.host}/ws`);
            ws.onmessage = (event) => {
                const msg = JSON.parse(event.data);
                if (msg.type === 'state') { 
                    state = msg.data; 
                    updateUI(); 
                    logTerminal(msg.data);
                }
            };
            ws.onclose = () => setTimeout(connect, 2000);
        }

        function logTerminal(data) {
            const term = document.getElementById('raw-terminal');
            if(!term) return;
            
            // Format a clean mini-packet to show
            const raw = `{"t":${data.global_time.toFixed(1)}, "nodes":${data.nodes.length}, "err":${data.avg_sync_error.toFixed(4)}}`;
            
            const line = document.createElement('div');
            line.className = 'term-line';
            
            const d = new Date();
            const ts = `${d.getHours()}:${d.getMinutes().toString().padStart(2,'0')}:${d.getSeconds().toString().padStart(2,'0')}.${d.getMilliseconds().toString().padStart(3,'0')}`;
            
            line.innerHTML = `<span class="term-ts">[${ts}]</span>${raw}`;
            term.appendChild(line);
            
            while(term.childNodes.length > termMaxLines) {
                term.removeChild(term.firstChild);
            }
            term.scrollTop = term.scrollHeight;
        }

        function updateUI() {
            document.getElementById('sync-mode-badge').textContent = `MODE: ${state.sync_mode === 'basic' ? 'One-Way Broadcast' : 'Two-Way EKF'}`;
            document.getElementById('metric-nodes').textContent = state.nodes.length;
            document.getElementById('metric-uptime').textContent = `${state.global_time}s`;

            const leader = state.nodes.find(n => n.is_elected_ref);
            document.getElementById('metric-leader').textContent = leader ? `UAV-${leader.node_id}` : 'None';
            document.getElementById('metric-error').textContent = `${(state.avg_sync_error * 1000).toFixed(2)} ms`;

            const container = document.getElementById('nodes-container');
            container.innerHTML = '';
            
            [...state.nodes].sort((a,b) => a.node_id - b.node_id).forEach(node => {
                const card = document.createElement('div');
                card.className = `node-card`;
                
                const status = node.is_elected_ref ? 'Leader' : (node.sync_state === 'synchronized' ? 'Synced' : 'Drifting');
                const sClass = node.is_elected_ref ? 'leader' : (node.sync_state === 'synchronized' ? 'synced' : 'drifting');
                const ledClass = node.is_elected_ref ? 'green' : (node.sync_state === 'synchronized' ? 'green' : 'red');

                card.innerHTML = `
                    <div class="node-header">
                        <span class="node-name"><div class="led ${ledClass}"></div> UAV-${node.node_id}</span>
                        <span class="node-status ${sClass}">${status}</span>
                    </div>
                    <div class="node-content">
                        <div class="node-details">
                            <div>ERR: <span class="val">${(node.offset*1000000).toFixed(1)} us</span></div>
                            <div>SIG: <span class="val">${node.is_master ? '---' : node.rssi} dBm</span></div>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });

            drawTopology();
            drawChart();
        }

        function drawTopology() {
            const canvas = document.getElementById('topology-canvas');
            if (!canvas) return;
            const ctx = canvas.getContext('2d');
            canvas.width = canvas.parentElement.clientWidth;
            canvas.height = canvas.parentElement.clientHeight;
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            const nodes = state.nodes;
            if (nodes.length === 0) return;

            const cx = canvas.width / 2, cy = canvas.height / 2;
            const r = Math.min(canvas.width, canvas.height) / 2 - 30;

            const pos = {};
            nodes.forEach((n, i) => {
                const a = (i * 2 * Math.PI) / nodes.length - Math.PI / 2;
                pos[n.node_id] = { x: cx + r * Math.cos(a), y: cy + r * Math.sin(a) };
            });

            const leader = nodes.find(n => n.is_elected_ref);
            if (leader) {
                const pL = pos[leader.node_id];
                nodes.forEach(n => {
                    if (n.node_id === leader.node_id) return;
                    const pN = pos[n.node_id];
                    ctx.strokeStyle = n.sync_state === 'synchronized' ? '#10b981' : '#cbd5e1';
                    ctx.lineWidth = 2;
                    ctx.setLineDash([5, 5]);
                    ctx.beginPath(); ctx.moveTo(pL.x, pL.y); ctx.lineTo(pN.x, pN.y); ctx.stroke();
                    
                    ctx.setLineDash([]);
                    const midX = (pL.x + pN.x) / 2;
                    const midY = (pL.y + pN.y) / 2;
                    ctx.fillStyle = 'rgba(255, 255, 255, 0.9)';
                    ctx.fillRect(midX - 15, midY - 8, 30, 16);
                    ctx.fillStyle = '#64748b'; ctx.font = '9px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                    ctx.fillText(`${n.rssi}`, midX, midY);
                });
            }

            nodes.forEach(n => {
                const p = pos[n.node_id];
                ctx.fillStyle = n.is_elected_ref ? colors.ref : colors.slave;
                ctx.beginPath(); ctx.arc(p.x, p.y, 14, 0, 2 * Math.PI); ctx.fill();
                ctx.fillStyle = '#fff'; ctx.font = 'bold 10px sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
                ctx.fillText(n.node_id, p.x, p.y);
            });
        }

        let chartInit = false;
        function drawChart() {
            if (!document.getElementById('offset-chart')) return;
            
            const x = state.sync_history.map(p => p[0]);
            const y = state.sync_history.map(p => p[1] * 1000); // ms

            // Oscilloscope
            const dataLine = [{
                x: x, y: y,
                type: 'scatter', mode: 'lines',
                line: { color: '#2563eb', width: 2 },
                fill: 'tozeroy', fillcolor: 'rgba(37, 99, 235, 0.1)'
            }];

            const layoutLine = {
                margin: { t: 10, r: 10, b: 30, l: 40 },
                xaxis: { title: 'Time (s)', color: '#64748b', gridcolor: '#f1f5f9' },
                yaxis: { title: 'Offset (ms)', color: '#64748b', gridcolor: '#f1f5f9' },
                paper_bgcolor: 'transparent', plot_bgcolor: 'transparent'
            };

            // Histogram
            const dataHist = [{
                x: y,
                type: 'histogram',
                marker: { color: '#6366f1' },
                opacity: 0.7,
                xbins: { size: 0.5 }
            }];

            const layoutHist = {
                margin: { t: 10, r: 10, b: 30, l: 40 },
                xaxis: { title: 'Error Range (ms)', color: '#64748b', gridcolor: '#f1f5f9' },
                yaxis: { title: 'Frequency', color: '#64748b', gridcolor: '#f1f5f9' },
                paper_bgcolor: 'transparent', plot_bgcolor: 'transparent',
                bargap: 0.1
            };

            if (!chartInit) { 
                Plotly.newPlot('offset-chart', dataLine, layoutLine, { displayModeBar: false, responsive: true }); 
                Plotly.newPlot('hist-chart', dataHist, layoutHist, { displayModeBar: false, responsive: true }); 
                chartInit = true; 
            } else { 
                Plotly.react('offset-chart', dataLine, layoutLine); 
                Plotly.react('hist-chart', dataHist, layoutHist); 
            }
        }

        window.onload = connect;
        window.addEventListener('resize', () => { 
            drawTopology(); 
            if(chartInit) {
                Plotly.Plots.resize('offset-chart');
                Plotly.Plots.resize('hist-chart');
            }
        });
    </script>
</body>
</html>
